<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Pakhtoon Community</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="frontened/login.css">

    </head>
<body>

    <div class="login-card">
        <h2>Community Login</h2>
        <form action="backend/auth.php" method="POST">
        
            <div class="select-option">
                <label class="form-label">Role</label>
                <select class="form-select" name="role" id="form-select" aria-label="Role" required>
                    <option value="" selected disabled>Select your role</option>
                    <option value="student">Student Member</option>
                    <option value="admin">Admin / Leader</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" id="form-in" placeholder="Enter username" required>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" name="password" class="form-control" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" name="login_btn" class="btn btn-primary">Submit</button>
        </form>
    </div>

</body>
</html>
